
[tool.ruff.lint]
# ah#334: pyflakes only — real defects (undefined names, unused imports, redefinitions),
# not style. Deliberately narrow so the gate is signal rather than noise.
#
# F841 (unused-variable) is NOT enabled yet: its 28 remaining occurrences need per-case
# judgment, not a bulk pass. At least two are load-bearing rather than dead —
# `train_runner._fab_provenance_or_block` assigns `read_provenance(...)` and discards it,
# but the CALL exists to raise, so ruff's unsafe fix would delete the guard. Tracked as a
# follow-up to ah#334; enabling it blind would either break code or teach people to
# `# noqa` the gate.
select = ["F"]
ignore = ["F841"]

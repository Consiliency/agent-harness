name: baml-i1-sweep

# agent-harness#1135: the FULL I1 interrupt sweep of the BAML worker client
# (3 exception types x 4 scenarios, every instruction boundary of the calling-
# thread path). About 40 min per Python, so it is not in PR CI: pull requests
# run the fixed regression subset (test_i1_boundary_subset in test.yml's pytest
# lane). This workflow runs it weekly and on dispatch, and a release cut
# requires a green run on the release commit (docs/releases/baml-v1-release-checks.md).
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: baml-i1-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: full I1 sweep (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the runtime
        run: |
          set -euo pipefail
          python -m pip install "./phase-loop-runtime[visual]" pytest

      - name: Full I1 sweep
        working-directory: phase-loop-runtime
        env:
          PHASE_LOOP_BAML_FULL_SWEEP: '1'
        run: |
          set -euo pipefail
          PYTHONPATH=src:tests python -m pytest -q -p no:cacheprovider -rs \
            tests/test_phase_loop_baml_v1_runtime.py -k "i1_boundary_sweep"

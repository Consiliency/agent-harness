name: qualified-agy-image

# AGYROLL §3.3 (agent-harness#1008, R1): every pull request and push runs `--contract`, with
# no path filter, because the seat QCI reads files outside any agy-specific path
# (`panel_invoker.py` among them). The full pin (agent-harness#1032) and the route-core gate
# (agent-harness#1029) were removed; the release gate is the strict conformance suite plus
# `--release` in publish-pypi.yml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: agy catalog contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Verify the agy catalog contract
        working-directory: phase-loop-runtime
        run: uv run --locked python scripts/verify_qualified_agy_image.py --contract

  upstream:
    name: latest agy release asset
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Verify latest release, archive and executable
        working-directory: phase-loop-runtime
        run: uv run --locked python scripts/verify_qualified_agy_image.py --upstream-only

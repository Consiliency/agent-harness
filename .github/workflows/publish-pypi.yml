name: publish-pypi

# Publish phase-loop-runtime to PyPI on a version tag, via PyPI Trusted
# Publishing (OIDC) — no API token is stored in the repo. One-time setup on
# PyPI: create/claim project "phase-loop-runtime" and add a Trusted Publisher:
#   owner=ViperJuice  repo=agent-harness  workflow=publish-pypi.yml  environment=pypi
on:
  push:
    tags: [v*]
  pull_request:
    paths:
      - 'phase-loop-runtime/**'
      - 'RELEASE_PIN'
      - '.github/workflows/publish-pypi.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build + verify wheel + sdist
    runs-on: ubuntu-24.04  # pinned: test.yml's Gate A image; ubuntu-latest moved to 26.04 (agent-harness#1763)
    # A pull_request run deselects the CONFORM chronology node and is measured at
    # 7-12 minutes (docs/releases/publish-pypi-build-timeout.md). A tag or
    # workflow_dispatch run executes the FULL standalone suite in Gate A and is
    # measured at 70 minutes (v0.7.14); the 25-minute cap cancelled the v0.7.15 tag
    # run at 50% of that suite. The bound is per path, each about twice its
    # measured worst case (the headroom agent-harness#757 applied): 25 ~= 2 x 12,
    # 140 = 2 x 70. (`a && b || c` is a value-select; it is safe because 25 != 0.)
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 140 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install review sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap slirp4netns iptables util-linux
          # Only this ephemeral CI runner: unshare must be allowed to create the
          # user/network namespaces whose enforcement the integration tests prove.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / -- /bin/true
          unshare --net --map-root-user true
      - name: agy release gate (strict conformance and --release, AGYROLL §3.3-§3.4)
        # agent-harness#1008 R1. Before the build, `--release` runs the contract, then EXECUTES
        # the strict conformance suite itself (AGY_CONFORMANCE_STRICT=1) and accepts only the
        # report that run just wrote (agent-harness#1937 re-check M4), then verifies every
        # member's official archive. The driver launches its provider through the per-seat
        # resource caps (agent-harness#1895), which need a systemd user manager that delegates
        # cpu, cpuset, io, memory and pids (docs/seat-resource-caps.md). This ephemeral runner
        # is given exactly that host prerequisite, and the verifier runs inside that manager,
        # as on a seat host. Nothing about the caps is faked. The environment and the report
        # live under $RUNNER_TEMP, never in the tree the build packages.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agy-conformance-venv
        run: |
          python -m pip install uv
          mkdir -p -m 0700 "$RUNNER_TEMP/agy-conformance"
          (cd phase-loop-runtime && PYTHONDONTWRITEBYTECODE=1 uv sync --locked --group test --no-install-project)
          uid="$(id -u)"
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' \
            | sudo tee /etc/systemd/system/user@.service.d/delegate.conf >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          # A manager started before the drop-in keeps its old controller mask: restart it.
          sudo systemctl restart "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          for _ in $(seq 60); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          controllers="/sys/fs/cgroup/user.slice/user-$uid.slice/user@$uid.service/cgroup.controllers"
          for controller in cpu io memory pids; do
            grep -qw "$controller" "$controllers" \
              || { echo "::error::user manager does not delegate $controller"; exit 1; }
          done
          cd phase-loop-runtime
          systemd-run --user --pipe --wait --collect --quiet --same-dir -p Type=oneshot \
            -E PYTHONDONTWRITEBYTECODE=1 -E PATH="$PATH" -E HOME="$HOME" \
            -- timeout 1800 "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/verify_qualified_agy_image.py \
            --release --conformance-report "$RUNNER_TEMP/agy-conformance/conformance.xml"
      - name: Verify tag matches phase-loop-runtime version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib; print(tomllib.load(open("phase-loop-runtime/pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag  pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match pyproject version $ver"; exit 1; }
      - name: Build sdist + wheel
        # Reproducible archives: archive timestamps come from the built commit's
        # committer time, and member modes from a fixed umask.
        run: |
          python -m pip install --upgrade build uv
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          umask 022
          python -m build --sdist --wheel --outdir dist phase-loop-runtime
          # setuptools stamps sdist members with checkout mtimes and the gzip header
          # with the wall clock; rewrite both from SOURCE_DATE_EPOCH, keeping order.
          python - "$SOURCE_DATE_EPOCH" dist/*.tar.gz <<'PY'
          import gzip
          import io
          import sys
          import tarfile

          epoch = int(sys.argv[1])
          for path in sys.argv[2:]:
              out = io.BytesIO()
              with tarfile.open(path, "r:gz") as src, tarfile.open(
                  fileobj=out, mode="w", format=tarfile.PAX_FORMAT
              ) as dst:
                  for member in src.getmembers():
                      member.mtime = min(int(member.mtime), epoch)
                      member.uid = member.gid = 0
                      member.uname = member.gname = ""
                      member.pax_headers = {}
                      data = src.extractfile(member) if member.isfile() else None
                      dst.addfile(member, data)
              with open(path, "wb") as raw, gzip.GzipFile(
                  filename="", mode="wb", fileobj=raw, mtime=epoch, compresslevel=9
              ) as gz:
                  gz.write(out.getvalue())
          PY
      - name: Verify exact wheel in an isolated locked environment
        run: |
          python -m venv /tmp/phase-loop-release-wheel
          /tmp/phase-loop-release-wheel/bin/python -m pip install --upgrade pip
          VIRTUAL_ENV=/tmp/phase-loop-release-wheel uv sync \
            --project phase-loop-runtime \
            --extra visual \
            --group test \
            --locked \
            --no-install-project \
            --active
          /tmp/phase-loop-release-wheel/bin/python -m pip install --force-reinstall \
            --no-deps dist/phase_loop_runtime-*.whl
          /tmp/phase-loop-release-wheel/bin/python - <<'PY'
          import site
          from pathlib import Path

          source = Path("phase-loop-runtime/src").resolve()
          site_packages = Path(site.getsitepackages()[0]).resolve()
          (site_packages / "release_candidate_source_data.pth").write_text(
              str(source) + "\n", encoding="utf-8"
          )
          PY
          PYTHONPATH=phase-loop-runtime/tests \
            /tmp/phase-loop-release-wheel/bin/python - <<'PY'
          from pathlib import Path
          import phase_loop_runtime

          source = Path("phase-loop-runtime/src").resolve()
          runtime_file = Path(phase_loop_runtime.__file__).resolve()
          assert not runtime_file.is_relative_to(source), runtime_file
          PY
          /tmp/phase-loop-release-wheel/bin/python - <<'PY'
          import importlib.metadata
          import importlib.util
          import pathlib

          distribution = importlib.metadata.distribution("phase-loop-runtime")
          assert distribution.version
          root = pathlib.Path(distribution.locate_file("")).resolve()
          spec = importlib.util.find_spec("phase_loop_runtime.agy_canary_evidence")
          assert spec is not None and spec.origin is not None
          assert pathlib.Path(spec.origin).resolve().is_relative_to(root)
          PY
          # agent-harness#1135: BAML v1 pin plus a real parse through the worker.
          /tmp/phase-loop-release-wheel/bin/python - <<'PY'
          import importlib.metadata
          import json
          import sys

          assert importlib.metadata.version("baml-bridge") == "0.23.0"
          from phase_loop_runtime.baml_modular import parse_baml_response

          parsed = parse_baml_response("EmitPhaseCloseout", json.dumps({
              "terminal_status": "complete", "verification_status": "passed",
              "dirty_paths": [], "produced_if_gates": ["G"], "required_human_inputs": [],
          }))
          assert parsed.payload["terminal_status"] == "complete", parsed.payload
          assert "baml_bridge" not in sys.modules
          import pathlib, phase_loop_runtime
          assert not (pathlib.Path(phase_loop_runtime.__file__).parent / ".baml").exists(), "worker wrote .baml"
          PY
          for sub in agy-canary-probe agy-canary-clean-settings \
                     agy-canary-bootstrap-attest agy-canary-prepare \
                     agy-canary-verify agy-canary-finalize; do
            /tmp/phase-loop-release-wheel/bin/phase-loop "$sub" --help >/dev/null
          done
      - name: Gate A — verify the exact prebuilt wheel in a clean room
        # A release tag and a manual dispatch run the FULL standalone suite. A
        # pull_request run of this workflow deselects the heavy CONFORM chronology
        # node: test.yml's landing push and nightly retain it (per
        # ci/chronology-scope.sh), so running it here again proves nothing new;
        # the script's junit witness proves the node is absent from the evidence.
        # agent-harness#1029: a pull_request run now skips the standalone suite here
        # entirely (the wheel is still built, installed and probed): test.yml's pytest
        # lane runs the same tests on the same PR head, but from the checkout rather than
        # the installed wheel -- that installed-layout run now happens after merge (push
        # and nightly Gate A) and, in full, on a tag or dispatch before publication.
        env:
          GATE_A_JUNIT: ${{ runner.temp }}/junit-release-gate-a.xml
          GATE_A_DESELECT_CHRONOLOGY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PHASE_LOOP_SKIP_GATE_A_SUITE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          GATE_A_WHEEL="$(realpath "${wheels[0]}")" \
            bash phase-loop-runtime/scripts/gate_a_cleanroom.sh
      - name: Record exact artifact SHA-256 tuples
        run: |
          mkdir -p release
          sha256sum dist/* | tee release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phase-loop-runtime-dist
          path: |
            dist/
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase-loop-runtime-dist
          path: .
      - name: Verify downloaded artifact tuples without rebuilding
        run: sha256sum --check release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

  github-release:
    name: record published package on GitHub
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase-loop-runtime-dist
          path: .
      - name: Verify published artifact tuples without rebuilding
        run: sha256sum --check release/SHA256SUMS
      - name: Create GitHub Release after successful trusted publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A failed release-record job can be rerun without republishing to PyPI.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft > release/existing.json; then
            recovery="Inspect $GITHUB_REF_NAME: restore missing or mismatched assets from this run's phase-loop-runtime-dist artifact, publish the draft if appropriate, then rerun only this failed job. Do not republish to PyPI."
            if ! jq -e '.isDraft == false' release/existing.json >/dev/null; then
              echo "::error::Existing release is still a draft. $recovery"
              exit 1
            fi
            verification_dir="$(mktemp -d)"
            trap 'rm -rf "$verification_dir"' EXIT
            for artifact in dist/* release/SHA256SUMS; do
              name="$(basename "$artifact")"
              if ! gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --pattern "$name" --dir "$verification_dir"; then
                echo "::error::Cannot verify existing asset $name. $recovery"
                exit 1
              fi
              if ! cmp --silent "$artifact" "$verification_dir/$name"; then
                echo "::error::Existing asset $name differs from the verified publication artifact. $recovery"
                exit 1
              fi
            done
            echo "Published GitHub Release and every expected asset verified for $GITHUB_REF_NAME"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          {
            printf 'phase-loop-runtime %s.\n\n' "$version"
            printf 'Published through GitHub Actions trusted publishing to [PyPI](https://pypi.org/project/phase-loop-runtime/%s/).\n\n' "$version"
            printf '[Publication run](%s/%s/actions/runs/%s). The attached wheel and sdist are the verified publication artifacts; nothing was rebuilt.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > release/NOTES.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "phase-loop-runtime $version" \
            --notes-file release/NOTES.md dist/* release/SHA256SUMS

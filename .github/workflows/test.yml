name: test

on:
  push:
    branches: [main]
  pull_request:
  # The heavy CONFORM chronology node (~50 min, ~88% of a per-PR run) is scoped
  # by ci/chronology-scope.sh: every push to main and this nightly run RETAIN it
  # unconditionally; a pull_request DEFERS it to the landing push unless its diff
  # touches the gate's own selection plumbing (the script's table). The nightly
  # is the backstop that bounds how long a regression can stay invisible,
  # independent of merge traffic; the `main-red` job below is what makes a red
  # landing push visible (a labelled issue) without anyone watching this tab.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      chronology:
        description: Run the heavy CONFORM chronology node (false = quick suite)
        type: boolean
        default: true

permissions:
  contents: read

# Only pull_request runs supersede each other. Every other event (the push to
# main that is the landing proof, the nightly, a manual dispatch) gets a group
# unique to its own run, so it is never cancelled AND never replaced while
# pending: a manual chronology=false dispatch can neither cancel a retained
# landing run nor evict one that is still queued behind it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || format('test-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # CI-offload job graph: elig -> {offload | hosted} -> gate
  #
  # `elig` computes eligibility IN A STEP, because a job-level `if:` cannot read
  # `secrets` -- that limitation is what made the earlier "one job, two step
  # pairs" shapes unimplementable. Exactly one of `offload`/`hosted` then runs,
  # gated on opposite values, and `gate` aggregates them.
  #
  # `gate` exists because a conditionally-skipped job reports `skipped`, and a
  # SKIPPED JOB SATISFIES A REQUIRED STATUS CHECK. Requiring `offload`/`hosted`
  # directly would re-create the false-green class one layer up: skip both and
  # the branch looks green with no suite verdict at all. `gate` cannot be skipped
  # (`if: always()`) and cannot pass without exactly one real SUCCESS.
  # ---------------------------------------------------------------------------
  elig:
    name: CI-offload eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.elig.outputs.eligible }}
    steps:
      - name: Determine CI-offload eligibility
        id: elig
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          # Secrets are readable in a step context, never in a job-level `if:`.
          # GitHub also withholds secrets from fork-PR runs, so this is a second,
          # independent reason a fork can never reach the offload path.
          TS_AUTHKEY_SET: ${{ secrets.TS_AUTHKEY != '' }}
        run: |
          set -euo pipefail
          trusted=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            trusted=true
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPO" = "$REPO" ]; then
            trusted=true
          fi
          # Scheduled and manually dispatched runs execute the repository's own
          # default-branch workflow with its secrets; no fork can reach either.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            trusted=true
          fi
          eligible=false
          if [ "$trusted" = "true" ] && [ "$TS_AUTHKEY_SET" = "true" ]; then
            eligible=true
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "trusted=$trusted eligible=$eligible"

  offload:
    name: suite (offloaded to ai)
    runs-on: ubuntu-latest
    needs: elig
    if: needs.elig.outputs.eligible == 'true'
    # One job runs ALL the heavy stages, so this budget is not the per-lane 100
    # the hosted jobs use. The Dagger module runs them concurrently, so the wall
    # clock is max(py3.10, Gate A) -- ~60 min on a warm engine when the chronology
    # node is retained, 7:45 when it is deselected (measured on run 33773648179,
    # a chronology=false dispatch of main). 120 leaves room for a
    # cold-image run and a Gate A slower than the ~58 min its hosted 86:36 scales
    # to. Run 4 timed out at 100 running them SEQUENTIALLY.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # The chronology proof walks real history and reads historical blobs.
          # A shallow or blob-filtered checkout fails the module's object-database
          # probe by design -- fetch everything.
          fetch-depth: 0
      - name: Decide whether this run retains the chronology node
        id: scope
        env:
          CHRONOLOGY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHRONOLOGY_FORCE: ${{ inputs.chronology }}
        run: bash ci/chronology-scope.sh >> "$GITHUB_OUTPUT"
      - name: Offload the suite to the tailnet host
        # Pinned to a full commit SHA, never a moving tag.
        uses: Consiliency/ci-actions/dagger-offload@ea4ba36ba29f18ae4f22e65ae4b8b63e7c7468ee
        env:
          # Read by ci/offload-gate.sh; unset there means "retain" (fail closed).
          CHRONOLOGY: ${{ steps.scope.outputs.chronology }}
        with:
          command: "bash ci/offload-gate.sh"
          eligible: ${{ needs.elig.outputs.eligible }}
          ts-authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Upload offloaded junit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-offloaded
          path: junit-offload/**
          if-no-files-found: error

  hosted:
    name: suite (hosted fallback)
    runs-on: ubuntu-latest
    # The hosted suite of record on the fork/no-secret path is the existing
    # matrix + clean-room pair below (they carry the two-lane selection, the
    # retention guard's subject, and the junit uploads). This job collapses their
    # verdict into ONE result for `gate`, instead of duplicating the suite.
    #
    # The opposite of `offload`, never `failure()`/`always()`: this is the
    # fork/no-secret path, NOT a fallback from a failed offload. A failed offload
    # must stay failed -- otherwise an unreachable host silently becomes green.
    needs: [elig, pytest, chronology-retention, cleanroom]
    if: always() && needs.elig.outputs.eligible != 'true'
    timeout-minutes: 5
    steps:
      - name: Collapse the hosted lanes into one verdict
        env:
          PYTEST: ${{ needs.pytest.result }}
          RETENTION: ${{ needs.chronology-retention.result }}
          CLEANROOM: ${{ needs.cleanroom.result }}
        run: |
          set -euo pipefail
          echo "pytest=$PYTEST retention=$RETENTION cleanroom=$CLEANROOM"
          for r in "$PYTEST" "$RETENTION" "$CLEANROOM"; do
            if [ "$r" != "success" ]; then
              echo "hosted suite FAILED: a hosted lane did not succeed" >&2
              exit 1
            fi
          done
          echo "hosted suite: all lanes green"

  gate:
    name: suite gate
    runs-on: ubuntu-latest
    needs: [offload, hosted]
    # Never skipped: `needs` failing or skipping must still land here.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require exactly one real suite verdict
        env:
          OFFLOAD: ${{ needs.offload.result }}
          HOSTED: ${{ needs.hosted.result }}
        run: |
          set -euo pipefail
          echo "offload=$OFFLOAD hosted=$HOSTED"
          successes=0
          [ "$OFFLOAD" = "success" ] && successes=$((successes + 1)) || true
          [ "$HOSTED" = "success" ] && successes=$((successes + 1)) || true
          if [ "$successes" -ne 1 ]; then
            echo "" >&2
            echo "suite gate FAILED: expected exactly one of offload/hosted to succeed," >&2
            echo "got offload=$OFFLOAD hosted=$HOSTED (successes=$successes)." >&2
            echo "" >&2
            echo "A skipped job satisfies a required status check, so this aggregate" >&2
            echo "gate -- not offload/hosted individually -- is the required check." >&2
            echo "Both skipped means NO suite ran: that is a red, not a green." >&2
            exit 1
          fi
          echo "suite gate: exactly one real suite verdict (success)"

  lint:
    name: lint (pyflakes)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ruff check (config-driven)
        # ah#334: before this job CI ran NO linter, which is how an undefined name in an
        # annotation shipped past a green suite on every Python version (ah#291) —
        # `from __future__ import annotations` defers evaluation, so only a linter or
        # get_type_hints() can see it.
        #
        # Its OWN job, not a step gated on `matrix.python-version == '3.12'`: a
        # matrix-conditional step silently vanishes if the matrix is ever bumped past
        # that version, taking the gate with it and leaving CI fully green.
        #
        # Selection lives in the root ruff.toml (select = ["F"], ignore = ["F841"]).
        # Do NOT pass --select on the CLI: it overrides the config's ignore and
        # re-enables the deliberately deferred F841.
        #
        # ruff is pinned: it is pre-1.0 and adds F-rules between releases, which would
        # otherwise red the build for unrelated contributors at an arbitrary time.
        run: |
          python -m pip install 'ruff==0.15.5'
          ruff check .

  pytest:
    name: pytest (py${{ matrix.python-version }})
    # Legacy hosted lanes. The offload graph above now owns the suite on the
    # eligible path; running these too would bill Blacksmith for work that
    # already ran on `ai` (acceptance criterion: billed minutes). Keep them
    # for the fork/no-secret path, where `hosted` is the suite of record.
    needs: elig
    if: needs.elig.outputs.eligible != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For pull_request events, check out the ACTUAL PR head commit rather
          # than GitHub's synthetic merge commit. The CONFORM proof machinery
          # inspects the live checkout's HEAD/history (introduction-boundary
          # walk, installed-wheel repository anchor) and requires it to BE the
          # candidate; a synthetic merge satisfies neither. On push events this
          # expression is empty and the default ref is used.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install phase-loop-runtime + pytest
        # No test extra is defined in pyproject; install the package + pytest.
        # The `visual` extra (Pillow) is required so the FAV visual-evidence
        # gate's decode-requiring tests (tests/phase_loop_test_utils.py
        # write_varied_png/write_blank_png/write_transparent_varied_png) run
        # instead of erroring at test time (agent-harness#91 round-4 CR).
        run: python -m pip install "./phase-loop-runtime[visual]" pytest "build==1.5.1" "setuptools>=68"

      - name: Guard — no scattered/duplicated hardcoded model IDs
        # Enforces the "reference the central constant, don't inline the model ID"
        # convention (model-id-source hybrid: registry allowlist + per-line marker).
        # Pure stdlib; fails the build on any unsanctioned concrete model-ID pin.
        working-directory: phase-loop-runtime
        run: python3 scripts/check_model_id_sources.py

      - name: Decide whether this run retains the chronology node
        id: scope
        env:
          CHRONOLOGY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHRONOLOGY_FORCE: ${{ inputs.chronology }}
        run: bash ci/chronology-scope.sh >> "$GITHUB_OUTPUT"

      - name: Run standalone test suite
        # The two frozen LEGIBLE files distinguish a canonical source checkout
        # from an installed consumer. Run them from a copied tests tree so this
        # source-checkout job also exercises the standalone-consumer posture.
        working-directory: phase-loop-runtime
        env:
          CHRONOLOGY: ${{ steps.scope.outputs.chronology }}
        run: |
          # tests/__init__.py prepends the sibling src tree in the TEST process
          # only; the evidence-verifier child inherits env, not sys.path. Export
          # the same PYTHONPATH the frozen command literals use so both processes
          # resolve production identically. The standalone leg below overrides it
          # deliberately to exercise the installed-consumer posture.
          # Chronology selection: when this run retains the heavy CONFORM
          # chronology node (~50 min; see ci/chronology-scope.sh) it runs in
          # exactly two of the four CI executions -- this py3.10 lane (oldest
          # supported interpreter; the node drives version-sensitive subprocess
          # machinery, cf. the 3.10-vs-3.12 egg-info divergence in
          # agent-harness#382) and Gate A (py3.12 clean room). The 3.11 and 3.12
          # matrix lanes always deselect it. The py3.10 lane always writes junit,
          # so the uploaded evidence witnesses the decision either way.
          CHRONOLOGY_NODE="$(bash ../ci/chronology-scope.sh --node)"
          suite_args=()
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            suite_args+=("--junitxml=$RUNNER_TEMP/junit-py310.xml")
            if [ "${CHRONOLOGY:-true}" = "true" ]; then
              expect=present
            else
              suite_args+=("--deselect=$CHRONOLOGY_NODE")
              expect=absent
            fi
          else
            suite_args+=("--deselect=$CHRONOLOGY_NODE")
            expect=""
          fi
          # The deselect must never become a silent no-op: if the node is renamed
          # or moved, `--deselect` matches nothing and pytest says nothing. Assert
          # the node is still collectable in THIS lane before relying on either
          # branch above.
          PYTHONPATH=src:tests python -m pytest --collect-only -q "$CHRONOLOGY_NODE" >/dev/null
          PYTHONPATH=src:tests python -m pytest -m "not dotfiles_integration" \
            "${suite_args[@]}" \
            --ignore tests/test_legible_roadmap_contract.py \
            --ignore tests/test_legible_evidence.py
          if [ -n "$expect" ]; then
            # The junit must WITNESS the decision: node present (ran, passed)
            # when retained, absent when deselected. A skipped row is neither.
            python scripts/chronology_witness.py \
              --junit "$RUNNER_TEMP/junit-py310.xml" --node "$CHRONOLOGY_NODE" --expect "$expect"
          fi
          suite_root="$(mktemp -d)/phase-loop-runtime"
          mkdir -p "$suite_root" "$(dirname "$suite_root")/specs"
          cp -r tests "$suite_root/tests"
          cp ../specs/phase-plans-v10.md "$(dirname "$suite_root")/specs/phase-plans-v10.md"
          PYTHONPATH="$suite_root/tests" python -m pytest \
            "$suite_root/tests/test_legible_roadmap_contract.py" \
            "$suite_root/tests/test_legible_evidence.py" \
            -m "not dotfiles_integration"

      - name: Upload chronology junit (py3.10 lane)
        # Durable per-node evidence: without the upload the xml dies with the
        # runner. Only the py3.10 lane produces it (the other lanes deselect the
        # node), and it must survive a red suite, hence if: always().
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: chronology-junit-py310
          path: ${{ runner.temp }}/junit-py310.xml
          if-no-files-found: error

      - name: WIRE-THE-DOCTOR — fail on a stale gating BOM target
        # A drift detector nobody invokes re-rots on day 1 (IF-0-AHADOPT-2). This
        # runs the INSTALLED `phase-loop doctor` against the live npm+PyPI
        # registries and fails the build if a GATING (repo-owned) BOM target is
        # stale — the auto-track install pin or the consiliency-contract floor.
        # It degrades to `unknown` (never fails) when a registry is unreachable,
        # so a network blip cannot red the build; only definitive drift gates.
        run: phase-loop doctor --fail-on-stale

  chronology-retention:
    name: chronology retention guard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    # Its OWN job, not a step inside the pytest matrix. A matrix-conditional step
    # silently vanishes if the matrix is ever bumped past that version, taking the
    # guard with it and leaving CI fully green (the documented hazard recorded at
    # the lint job above). This job reads the workflow and the scope script as
    # data and fails loudly if no execution still RUNS the heavy chronology node:
    # a matrix lane must retain it, the workflow must have the push-to-main and
    # nightly triggers, and the scope script must answer "retain" on both of those
    # events and on anything it cannot classify -- so narrowing the scope to zero
    # executions is impossible to do silently.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Assert the chronology node is retained on main, nightly, and one matrix lane
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, sys, yaml
          node = subprocess.run(
              ["bash", "ci/chronology-scope.sh", "--node"], check=True,
              capture_output=True, text=True,
          ).stdout.strip()
          if "::test_" not in node:
              sys.exit(f"chronology retention guard: scope script names no node: {node!r}")
          # yaml parses the bare `on` key as boolean True.
          wf = yaml.safe_load(open(".github/workflows/test.yml"))
          triggers = wf.get("on", wf.get(True))
          if "main" not in [str(b) for b in triggers["push"]["branches"]]:
              sys.exit("chronology retention guard: push-to-main trigger is gone")
          if not triggers.get("schedule"):
              sys.exit("chronology retention guard: the nightly schedule trigger is gone")
          for event in ("push", "schedule", "workflow_dispatch", "", "unknown_event"):
              env = {k: v for k, v in os.environ.items() if not k.startswith("CHRONOLOGY")}
              env["GITHUB_EVENT_NAME"] = event
              out = subprocess.run(
                  ["bash", "ci/chronology-scope.sh"], check=True, env=env,
                  capture_output=True, text=True,
              ).stdout.strip()
              if out != "chronology=true":
                  sys.exit(f"chronology retention guard: event={event!r} must retain the node, got {out!r}")
          pytest_job = wf["jobs"]["pytest"]
          versions = [str(v) for v in pytest_job["strategy"]["matrix"]["python-version"]]
          suite = next(
              step for step in pytest_job["steps"]
              if step.get("name") == "Run standalone test suite"
          )["run"]
          # A lane retains the node when it is NOT the deselecting branch. The step
          # deselects for every version except the one named in its equality test.
          retaining = [v for v in versions if f'= "{v}" ]' in suite]
          if not retaining:
              sys.exit(
                  "chronology retention guard: no matrix lane runs the heavy "
                  f"chronology node. Versions present: {versions}. The retained "
                  "lane plus Gate A carry the node; if a lane was removed, "
                  "retarget the retained lane rather than dropping it."
              )
          if "chronology-scope.sh --node" not in suite:
              sys.exit("chronology retention guard: the suite step no longer takes the node id from the scope script")
          print(f"chronology node retained on push/schedule/dispatch and in matrix lane(s): {retaining}")
          PYEOF

  cleanroom:
    name: clean-room (standalone-from-wheel, Gate A)
    # Legacy hosted lanes. The offload graph above now owns the suite on the
    # eligible path; running these too would bill Blacksmith for work that
    # already ran on `ai` (acceptance criterion: billed minutes). Keep them
    # for the fork/no-secret path, where `hosted` is the suite of record.
    needs: elig
    if: needs.elig.outputs.eligible != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For pull_request events, check out the ACTUAL PR head commit rather
          # than GitHub's synthetic merge commit. The CONFORM proof machinery
          # inspects the live checkout's HEAD/history (introduction-boundary
          # walk, installed-wheel repository anchor) and requires it to BE the
          # candidate; a synthetic merge satisfies neither. On push events this
          # expression is empty and the default ref is used.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build + pytest
        run: python -m pip install build pytest

      - name: Decide whether this run retains the chronology node
        id: scope
        env:
          CHRONOLOGY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHRONOLOGY_FORCE: ${{ inputs.chronology }}
        run: bash ci/chronology-scope.sh >> "$GITHUB_OUTPUT"

      - name: Gate A — standalone-from-wheel clean room
        # Builds the wheel, installs it into an isolated venv, and runs the FULL
        # standalone suite (TESTDECOUPLE), apart from CONFORM's four exact
        # runner-owned final-document nodes. Skills-bundle tests skip when the
        # sibling phase-loop-skills/ is absent (agent-harness#9); the runtime must
        # resolve only under site-packages, never a dotfiles checkout.
        working-directory: phase-loop-runtime
        # GATE_A_JUNIT steers the script's junit output to a runner path OUTSIDE the
        # script's own $WORK tree -- that tree is wiped by its `trap rm -rf EXIT`, and
        # the suite runs under `env -i`, so the path travels positionally into the
        # heredoc rather than through the environment.
        # GATE_A_DESELECT_CHRONOLOGY=1 drops the heavy chronology node when the
        # scope step decided this run does not retain it; the script's junit
        # witness then proves the node is absent from the evidence.
        env:
          GATE_A_JUNIT: ${{ runner.temp }}/junit-gate-a.xml
          GATE_A_DESELECT_CHRONOLOGY: ${{ steps.scope.outputs.chronology == 'false' && '1' || '0' }}
        run: bash scripts/gate_a_cleanroom.sh

      - name: Upload chronology junit (Gate A)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronology-junit-gate-a
          path: ${{ runner.temp }}/junit-gate-a.xml
          if-no-files-found: error

  # Report the gate's result on main as ONE labelled issue (`ci-main-red`):
  # created/commented/reopened on a red landing push or nightly, closed when the
  # gate is green again. PRs defer the chronology node to the landing push, so
  # this job is the notification channel for a regression no PR run could see.
  # Not a gate input: `gate` stays required-only and this job never blocks it.
  main-red:
    needs: gate
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
      && (needs.gate.result == 'failure' || needs.gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    # Per-head group. GitHub keeps at most ONE pending job per concurrency
    # group and cancels the previously pending one when another arrives, even
    # with cancel-in-progress false -- a single shared group could let a late
    # run of an OLDER head (which then exits at the script's stale check) evict
    # the pending reporter of the current tip and drop its report. Keyed by
    # head, reporters of distinct heads never cancel each other; the push and
    # the nightly of the SAME head serialise and carry identical content, so
    # losing one of them loses nothing. The residual race -- two heads both
    # passing the tip check in the same second and both creating an issue --
    # yields a duplicate the next green closes, never a dropped red.
    concurrency:
      group: main-red-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report the gate result on main
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          GH_TOKEN: ${{ github.token }}
        run: bash ci/main-red.sh

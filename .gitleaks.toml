# gitleaks config for the public agent-harness repo.
#
# The repo was extracted from a private dotfiles fleet repo and passed a Gate-B
# scrub (gitleaks-clean: fleet-host / username / path / IP / secret / 1password /
# provenance all 0). This config keeps it that way in CI.
#
# The default ruleset already reports ZERO findings on the current tree (verified
# locally with gitleaks v8), including the synthetic redaction-test fixtures under
# phase-loop-runtime/src/phase_loop_runtime/_test_fixtures/ — so NO path allowlist
# is added (an over-broad allowlist would weaken the gate). If a future synthetic
# fixture legitimately trips a rule, add a narrow path entry to [allowlist] below,
# scoped to the exact file, rather than disabling rules.

title = "agent-harness gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Narrow entries only for confirmed non-secret false positives: the HARDEN verifier self-test literal (agent-harness#737) and the SHA256 of convergence/broker/credsep.py in the source-bound Gemini qualification record (agent-harness#1010), and the SHA256s of credential_redaction.py and seat_credentials.py in the agy qualification records (agent-harness#1236, agent-harness#1248, agent-harness#1263, agent-harness#1293, agent-harness#1542, agent-harness#1581), and the fixed placeholder proxy session value in test_gemini_seat_egress_1170.py (agent-harness#1555), and the verified SHA256 of panel_invoker.py in the canary plan review record (agent-harness#1727), and the deterministic synthetic canonical coordinator-key digest (agent-harness#1770). None of these values is a credential."
paths = []
regexes = ['''q7Rt9vXz2LmN4pQ8''', '''f87b13733de2175a9609b7d812f7a0c37642582d8b006447feec7c6264e30753''', '''5f513b1bb789c1eb527ca2f6bfe246d17d09affbab5e0869a0677c9476b7a1b9''', '''e6318a22bce414608210df056aeadd777de271a88f9d65e0b82149125fba8a4c''', '''28a7ae40f6a88c584876adbabe6d6b27bad2e6cfe7fd55569d4ebb6205ebd9b8''', '''0e2a683ab7ad7b27ec7bf277592c67a852d15ecbc5cfcaeabfda67573c4f3acf''', '''dd1960cc600071d811a14db6571d39a82e4251a7adb9aa79455b2a5a3372e20d''', '''d005abf2af8281610bbba55c977620128661a56b7eb902feb3bcdefcc5cca5dd''', '''b7c0f2e1a9d34e5f8c1b2a3d4e5f6071''', '''bafe1e42193419d41fd146af28d312b4393b73037faa304e3da5ce4adaa254fb''', '''\Ae78ee814cca68f048093d6bb0b29f585a7542573c4cef6e362a8fefab4124b85\z''']

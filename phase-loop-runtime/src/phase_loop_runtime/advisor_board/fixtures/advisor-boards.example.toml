# Advisor Board config — FROZEN FORMAT (IF-0-ABDFREEZE-1).
#
# Location: $XDG_CONFIG_HOME/agent-harness/advisor-boards.toml
#           (default ~/.config/agent-harness/advisor-boards.toml)
#
# This is the on-disk shape ABDREG's loader parses. It is a fixture only — the
# loader, board presets, and unknown-key validation land in ABDREG (Phase 2).
# A board is a named, purpose-tagged, OPEN-ENDED list of seats. A seat is a
# cognition {model, effort, harness?, lens?, auth?, backing?}, model-first: the
# harness is a defaulted-but-overridable execution lane.

# Optional: the board a bare `advisor-board` invocation resolves to.
default_board = "default"

# Optional (agent-harness#1076, user file only): first-use self-qualification of a genuine
# upstream agy release whose digest is not release-qualified. On by default; `false`
# restores the hard refusal (`gemini_heartbeat_capability_unavailable`).
# [agy]
# self_qualification = false

# The default board reproduces today's 3-leg panel (byte-for-byte back-compat).
# Its three seats, in panel-leg order, render to today's exact CLI invocations:
#   codex  gpt-6-astra          effort=max  -> -c model_reasoning_effort=xhigh
#   gemini "Gemini 3.1 Pro" effort=high -> model "Gemini 3.1 Pro (High)"
#   claude claude-sonnet-5  effort=max  -> --effort max
[[boards]]
name = "default"
purpose = "premerge-review"
allow_api_key_fallback = false

  [[boards.seats]]
  model = "gpt-6-astra"
  effort = "max"
  harness = "codex"        # optional; omit to resolve via default_lane(model)
  auth = "subscription"    # subscription (default) | api_key
  backing = "homebrew"     # homebrew (default) | omnigent

  [[boards.seats]]
  model = "Gemini 3.1 Pro"
  effort = "high"
  harness = "gemini"

  [[boards.seats]]
  model = "claude-sonnet-5"
  effort = "max"
  harness = "claude"

# A purpose-tagged preset with an open-ended seat list (ABDREG ships the real
# presets: default, code-review, brainstorm, doc-edit, legal-review,
# legal-strategy-review, legal-brainstorm).
[[boards]]
name = "code-review"
purpose = "code-review"
allow_api_key_fallback = false

  [[boards.seats]]
  model = "gpt-6-astra"
  effort = "max"
  harness = "codex"

  [[boards.seats]]
  model = "claude-sonnet-5"
  effort = "max"
  harness = "claude"
  lens = "adversarial"     # optional review lens/persona

# Optional (PANEL, agent-harness#1078): per-task lane tables. Each lane is one seat: its
# lens, and the vendors that may fill it, in order. A lane whose first vendor is down is
# filled by the next available one (labelled a fallback lane); a lane with none is left
# unfilled. `min_distinct_vendors` (optional) replaces the named-seat rule with a minimum of
# distinct usable vendors at a plan / production_code landing. The same table in the
# repository's `.agent-harness/advisor-boards.toml` is read at the fetched target head,
# never the change under review; a change that edits it is validated as applied onto
# that head. Declared lenses may not reuse a built-in lens name.
# [panel.code-review]
# min_distinct_vendors = 3
# lanes = [
#   { lens = "adversarial", vendors = ["grok", "claude", "codex", "gemini"] },
#   { lens = "correctness", vendors = ["claude", "codex", "gemini", "grok"] },
#   { lens = "red-team", vendors = ["codex", "gemini", "grok", "claude"] },
#   { lens = "alternative-approach", vendors = ["gemini", "grok", "claude", "codex"] },
# ]
# [panel.code-review.lenses]
# "migration-safety" = "Check that the change is safe to roll forward and back."
